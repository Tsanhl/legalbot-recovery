name: Artifact drift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current-contract:
    runs-on: ubuntu-latest
    env:
      LEGALBOT_HOST: 127.0.0.1
      LEGALBOT_OFFICIAL_RESEARCH_ENABLED: "false"
      LEGALBOT_TEST_MODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Sync Python environment
        run: uv sync --frozen --all-extras
      - name: Ephemeral encryption key for Linux
        run: |
          echo "LEGALBOT_ENCRYPTION_KEY_B64=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Drift-check current Live60 contract
        run: uv run pytest backend/tests/test_live60_current_contract_drift.py backend/tests/test_github_workflow_pins.py
