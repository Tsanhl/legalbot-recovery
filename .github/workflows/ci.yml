name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      LEGALBOT_HOST: 127.0.0.1
      LEGALBOT_OFFICIAL_RESEARCH_ENABLED: "false"
      LEGALBOT_XERJ_ENABLED: "false"
      LEGALBOT_PHOENIX_ENABLED: "false"
      LEGALBOT_TEST_MODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Sync Python environment
        run: uv sync --frozen --all-extras
      - name: Ephemeral encryption key for Linux
        run: |
          echo "LEGALBOT_ENCRYPTION_KEY_B64=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Clean-room check
        run: uv run python scripts/check_clean_room.py
      - name: Verify live evaluation suite
        run: uv run python scripts/live_evaluation_suite.py verify
      - name: Summarise live evaluation suite
        run: uv run python scripts/live_evaluation_suite.py summary
      - name: Python tests
        run: uv run pytest

  python-static:
    runs-on: ubuntu-latest
    env:
      LEGALBOT_HOST: 127.0.0.1
      LEGALBOT_OFFICIAL_RESEARCH_ENABLED: "false"
      LEGALBOT_XERJ_ENABLED: "false"
      LEGALBOT_PHOENIX_ENABLED: "false"
      LEGALBOT_TEST_MODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Sync Python environment
        run: uv sync --frozen --all-extras
      - name: Ruff and mypy against temporary baseline
        run: uv run python scripts/ci/check_static_baseline.py

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install
        working-directory: web
        run: npm ci
      - name: Web lint
        working-directory: web
        run: npm run lint
      - name: Web test
        working-directory: web
        run: npm test
      - name: Web build
        working-directory: web
        run: npm run build
